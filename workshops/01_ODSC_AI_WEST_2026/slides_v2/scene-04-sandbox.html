<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandboxed Autonomy</title>
  <style>
    :root { --cycle: 8s; --red: #e0230f; --green: #16834b; --ink: #111; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .scene { display:grid; place-items:center; width:100%; height:100%; overflow:hidden; background:#111; }
    .stage {
      position:relative; width:min(100vw,177.7778vh); height:min(100vh,56.25vw);
      overflow:hidden; isolation:isolate; background:#111;
    }
    .room { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation:camera var(--cycle) ease-in-out infinite; }
    .wash {
      position:absolute; inset:0; background:linear-gradient(90deg,rgba(17,17,17,.06),transparent 35%,rgba(224,35,15,.04));
      pointer-events:none;
    }
    .boundary { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
    .boundary path { fill:none; stroke:var(--red); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 11px rgba(224,35,15,.8)); animation:pulse var(--cycle) ease-in-out infinite; }
    .badge {
      position:absolute; right:3.4%; top:4.5%; padding:1.1% 1.5%; color:var(--ink); background:rgba(255,255,255,.92);
      border-left:.42vmin solid var(--red); box-shadow:0 1vmin 2.5vmin rgba(0,0,0,.16); backdrop-filter:blur(8px);
      animation:badge var(--cycle) ease-in-out infinite;
    }
    .badge b { display:block; font-size:clamp(12px,1.35vw,24px); letter-spacing:.02em; text-transform:uppercase; }
    .badge span { display:block; margin-top:.3em; color:#6c6c73; font:700 clamp(8px,.7vw,12px)/1.2 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; }
    .chip {
      position:absolute; z-index:3; padding:.55rem .85rem; border-radius:999px; color:#fff;
      font-size:clamp(10px,.82vw,15px); font-weight:800; letter-spacing:.05em; text-transform:uppercase;
      box-shadow:0 .7vmin 1.5vmin rgba(0,0,0,.2); opacity:0; white-space:nowrap;
    }
    .allowed { left:17%; top:56%; background:var(--green); animation:allow var(--cycle) ease-in-out infinite; }
    .blocked { left:15%; top:38%; background:var(--red); animation:block var(--cycle) ease-in-out infinite; }
    .check, .stop {
      display:inline-grid; place-items:center; width:1.35em; height:1.35em; margin-right:.45em;
      border-radius:50%; background:rgba(255,255,255,.22); font-weight:900;
    }
    .spark { position:absolute; z-index:2; width:.75vmin; aspect-ratio:1; border-radius:50%; background:#fff; box-shadow:0 0 1.2vmin .35vmin #ffcc36; opacity:0; animation:spark var(--cycle) ease-out infinite; }
    .s1{left:52%;top:38%}.s2{left:64%;top:57%;animation-delay:.6s}.s3{left:83%;top:48%;animation-delay:1.15s}.s4{left:71%;top:37%;animation-delay:1.8s}
    .steam { position:absolute; left:14.4%; top:43%; width:2.2%; height:12%; opacity:0; animation:steam var(--cycle) ease-in-out infinite; }
    .steam::before,.steam::after { content:""; position:absolute; left:30%; width:.28vmin; height:70%; border-left:.35vmin solid rgba(255,255,255,.8); border-radius:50%; filter:blur(.1vmin); }
    .steam::after { left:65%; top:8%; height:55%; }
    .caption {
      position:absolute; left:50%; bottom:3.2%; z-index:5; transform:translate(-50%,12px); opacity:0;
      padding:.72rem 1.15rem; border-radius:999px; color:#fff; background:rgba(17,17,17,.86);
      font-size:clamp(12px,1.12vw,20px); font-weight:800; letter-spacing:.1em; text-transform:uppercase;
      backdrop-filter:blur(8px); animation:caption var(--cycle) ease infinite;
    }
    @keyframes camera { 0%,48%{transform:scale(1)} 72%{transform:scale(1.018)} 100%{transform:scale(1)} }
    @keyframes pulse { 0%,18%,100%{stroke-opacity:.45;stroke-width:4} 27%,36%{stroke-opacity:1;stroke-width:8} 50%,76%{stroke-opacity:.72;stroke-width:6} }
    @keyframes badge { 0%,8%{opacity:0;transform:translateY(-12px)} 16%,88%{opacity:1;transform:none} 100%{opacity:0} }
    @keyframes allow { 0%,12%{opacity:0;transform:translateX(-30%)} 20%{opacity:1} 34%{opacity:1;transform:translateX(210%)} 40%,100%{opacity:0;transform:translateX(230%)} }
    @keyframes block { 0%,38%{opacity:0;transform:translateX(-25%)} 46%{opacity:1;transform:translateX(105%)} 52%{opacity:1;transform:translateX(145%) scale(.92)} 59%{opacity:1;transform:translateX(40%) rotate(-4deg)} 67%,100%{opacity:0;transform:translateX(-15%) rotate(-8deg)} }
    @keyframes spark { 0%,18%,100%{opacity:0;transform:scale(.2)} 25%{opacity:1;transform:scale(1.35)} 31%{opacity:0;transform:scale(.4)} 55%{opacity:1;transform:scale(1)} 62%{opacity:0;transform:scale(.25)} }
    @keyframes steam { 0%,100%{opacity:0;transform:translateY(9%)} 18%,70%{opacity:.8;transform:translateY(-10%)} 82%{opacity:0;transform:translateY(-24%)} }
    @keyframes caption { 0%,68%{opacity:0;transform:translate(-50%,12px)} 76%,92%{opacity:1;transform:translate(-50%,0)} 100%{opacity:0;transform:translate(-50%,-4px)} }
    @media (prefers-reduced-motion:reduce) {
      .room,.boundary path,.badge,.chip,.spark,.steam,.caption{animation:none}
      .badge,.caption{opacity:1;transform:none}.caption{transform:translateX(-50%)}
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="Five robot agents work freely inside a transparent sandbox boundary while their user relaxes outside">
    <div class="stage">
      <img class="room" src="assets/agent-metaphor/scene-04-sandbox.png" alt="Five friendly robot agents working inside a transparent red sandbox enclosure while the director watches with coffee">
      <div class="wash" aria-hidden="true"></div>
      <svg class="boundary" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
        <path d="M376 319 L992 224 L1597 302 L1597 736 L982 823 L376 688 Z" />
      </svg>
      <div class="badge"><b>Docker Sandbox</b><span>Isolated micro VM</span></div>
      <div class="chip allowed"><span class="check">✓</span>Approved work</div>
      <div class="chip blocked"><span class="stop">×</span>Outside boundary</div>
      <i class="spark s1" aria-hidden="true"></i><i class="spark s2" aria-hidden="true"></i><i class="spark s3" aria-hidden="true"></i><i class="spark s4" aria-hidden="true"></i>
      <i class="steam" aria-hidden="true"></i>
      <div class="caption">Freedom to act. Boundaries that hold.</div>
    </div>
  </main>
</body>
</html>
